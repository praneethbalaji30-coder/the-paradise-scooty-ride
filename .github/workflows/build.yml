name: Build and Deploy Raylib Game

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: latest

    - name: Setup and Build Raylib for Web
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
        git clone --depth 1 https://github.com/raysan5/raylib.git
        cd raylib/src
        make PLATFORM=PLATFORM_WEB -j4

    - name: Compile C to WASM
      run: |
        emcc parCyc2.c -o index.html \
          -I./raylib/src \
          ./raylib/src/libraylib.a \
          -s USE_GLFW=3 -s ASYNCIFY=1 -s WASM=1 \
          --preload-file paradHeroscooty.png \
          --preload-file shikanjaMalik.png \
          --preload-file chotaMalik.png \
          --preload-file paraBgr.png

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
